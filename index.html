/* Mobile paper scaling */
.paper{
  width:900px;
  max-width:900px;
  transform:scale(calc((100vw - 52px) / 900));
  transform-origin:top left;
  margin:0;
  padding:24px 28px 32px;
  border-radius:2px;
}
#formBox{
  overflow:hidden;
}
#formBox .paper{
  margin-bottom:calc((100vw - 52px) / 900 * -1px);
}
.shell:has(.paper){
  min-height:calc(980px * ((100vw - 52px) / 900) + 20px);
}

/* fallback if :has is not supported */
.form-mobile-holder{
  width:100%;
  overflow:hidden;
}

.subhead{grid-template-columns:1fr 1fr 1fr;gap:16px;font-size:18px}
.subhead .center{text-align:center}
.subhead .right{text-align:right}
.name-col{width:250px}
.field-panel{width:320px}
.label-cell,.number-col,.participant-wrap>span{font-size:18px}
}

@media(max-width:420px){
.shell:has(.paper){
  min-height:calc(1040px * ((100vw - 42px) / 900) + 20px);
}
.paper{
  transform:scale(calc((100vw - 42px) / 900));
}
}

<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card glass">
    <div class="brand"><i class="ri-file-list-3-line"></i><span>PrayInfo</span></div>
    <p style="color:var(--muted);line-height:1.7">Login with Firebase Email/Password.</p>
    <div class="field"><label>Email</label><input id="loginEmail" class="input-dark" type="email"></div>
    <div class="field"><label>Password</label><input id="loginPassword" class="input-dark" type="password"></div>
    <button id="loginBtn" class="btn primary">Login</button>
    <div id="loginStatus" class="status"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="nav glass">
    <div class="nav-left"><i class="ri-stack-line"></i> PrayInfo</div>
    <div class="nav-center">
      <button class="nav-tab active" data-page="form">Form</button>
      <button id="navManager" class="nav-tab hidden" data-page="manager">Manager</button>

function fitMobilePaper(){
  const formBox = $("formBox");
  const paper = formBox?.querySelector(".paper");
  if(!formBox || !paper) return;
  if(window.innerWidth > 760){
    paper.style.transform = "";
    paper.style.width = "";
    paper.style.maxWidth = "";
    formBox.style.height = "";
    return;
  }
  const boxWidth = Math.max(280, formBox.clientWidth - 2);
  const baseWidth = 900;
  const scale = Math.min(1, boxWidth / baseWidth);
  paper.style.width = baseWidth + "px";
  paper.style.maxWidth = baseWidth + "px";
  paper.style.transform = `scale(${scale})`;
  paper.style.transformOrigin = "top left";
  formBox.style.height = (paper.scrollHeight * scale + 20) + "px";
  formBox.style.overflow = "hidden";
}

function formHTML(){return `<main class="paper"><h1>ពួកជំនុំតាមផ្ទះ</h1><section class="subhead"><div><label class="inline"><span>វាលស្មៅ៖</span><div class="field-picker" id="fieldPicker"><button type="button" class="field-toggle" id="fieldToggle"><span id="fieldValue">ជ្រើសរើស</span> <i class="ri-arrow-down-s-line"></i></button><div class="field-panel"><input id="fieldSearch" class="field-search" placeholder="ស្វែងរក..."><div id="fieldList" class="field-list"></div></div></div></label></div><div class="center"><label class="inline"><span>អ្នកគង្វាល៖</span><input id="pastorName" class="line-input" readonly></label></div><div class="right"><label class="inline"><span>កាលបរិច្ឆេទ៖</span><input id="currentDate" class="line-input date-input" type="date"></label></div></section><table><colgroup><col style="width:150px"><col></colgroup><tr><td class="label-cell">អ្នកចូលរួម <span class="participant-count" id="participantCount">(0នាក់)</span></td><td class="field-cell"><div class="participant-wrap"><span>ឈ្មោះ៖</span><div style="flex:1"><div id="selectedParticipant" class="selected-participant">សូមជ្រើសឈ្មោះពីបញ្ជី</div><div class="select-row"><select id="participantSelect"></select><button type="button" id="addParticipantBtn" class="add-btn">+ Add</button></div></div></div></td></tr><tr><td colspan="2"><table class="inner-table"><colgroup><col style="width:66px"><col style="width:250px"><col></colgroup><thead><tr class="prayer-header"><th class="number-col">លេខ</th><th class="name-col">ឈ្មោះ</th><th>សំណូមពរ</th></tr></thead><tbody id="prayerRows"></tbody></table></td></tr><tr class="gap-row"><td colspan="2"></td></tr><tr><td class="label-cell">រឿងពិសេស</td><td class="field-cell single-line"><textarea id="specialNote"></textarea></td></tr><tr><td class="label-cell">ដង្វាយ</td><td class="field-cell single-line"><textarea id="offering"></textarea></td></tr></table></main>`}
function openNewForm(){currentEntryId=null;selectedAreaId="";selectedParticipants=[];availableMembers=[];prayerRequests=Array(12).fill("");$("formBox").innerHTML=formHTML();$("emptyForm").classList.add("hidden");$("formBox").classList.remove("hidden");$("currentDate").value=new Date().toISOString().slice(0,10);bindForm();updateAccess();setTimeout(fitMobilePaper,50)}
$("newEntryBtn").onclick=openNewForm;

  renderFields();

  $("fieldSearch").oninput=()=>renderFields($("fieldSearch").value);

}
function renderFields(q=""){let list=$("fieldList");if(!list)return;list.innerHTML="";Object.entries(fieldAreas).filter(([id,a])=>(a.name||"").toLowerCase().includes(q.toLowerCase())).forEach(([id,a])=>{let b=document.createElement("button");b.className="field-option";b.textContent=a.name;b.onclick=()=>selectArea(id);list.appendChild(b)})}

function renderParticipants(){if(!$("participantCount"))return;$("participantCount").textContent=`(${selectedParticipants.length}នាក់)`;let box=$("selectedParticipant");clearNode(box);if(selectedParticipants.length){selectedParticipants.forEach((name,index)=>{let pill=appendTextNode(box,"span","pill",name);if(canEdit()){let removeBtn=document.createElement("button");removeBtn.type="button";removeBtn.className="pill-remove";removeBtn.setAttribute("aria-label","Remove participant");removeBtn.textContent="×";removeBtn.onclick=()=>removeParticipant(index);pill.appendChild(removeBtn)}})}else{box.textContent="សូមជ្រើសឈ្មោះពីបញ្ជី"}let sel=$("participantSelect");sel.textContent="";let empty=document.createElement("option");empty.value="";empty.textContent="ជ្រើសរើស";sel.appendChild(empty);availableMembers.filter(n=>!selectedParticipants.includes(n)).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o)})}
function renderRows(){let body=$("prayerRows");if(!body)return;body.textContent="";let total=Math.max(12,selectedParticipants.length);for(let i=0;i<total;i++){let tr=document.createElement("tr");tr.className="prayer-row";let num=document.createElement("td");num.className="number-col";num.textContent=selectedParticipants[i]?String(i+1):"";let nameCell=document.createElement("td");nameCell.className="name-col";appendTextNode(nameCell,"div","name-display",selectedParticipants[i]||"");let fieldCell=document.createElement("td");fieldCell.className="field-cell";let ta=document.createElement("textarea");ta.dataset.i=String(i);ta.value=prayerRequests[i]||"";ta.disabled=!canEdit();ta.oninput=()=>prayerRequests[i]=ta.value;fieldCell.appendChild(ta);tr.append(num,nameCell,fieldCell);body.appendChild(tr)}setTimeout(fitMobilePaper,30);["currentDate","specialNote","offering"].forEach(id=>$(id).disabled=!canEdit());$("participantSelect").disabled=!canEdit();$("addParticipantBtn").style.display=canEdit()?"":"none"}
function collect(){
  let a=fieldAreas[selectedAreaId]||{};

  let pastorText=(a.pastorName || $("pastorName")?.value || "").trim();
  return{fieldAreaId:selectedAreaId||"",fieldArea:fieldText,pastorName:pastorText,currentDate:$("currentDate")?.value||"",participants:[...selectedParticipants],prayerRequests:[...prayerRequests],specialNote:$("specialNote")?.value||"",offering:$("offering")?.value||"",updatedAt:Date.now(),updatedBy:user?.email||""}
}
$("saveEntryBtn").onclick=async()=>{if(!canEdit())return;let d=collect();if(!d.fieldArea||!d.currentDate){status($("formStatus"),"Choose field area and date.");return}if(currentEntryId){await set(ref(db,`prayinfoEntries/${currentEntryId}`),{...(entries[currentEntryId]||{}),...d});log("update",currentEntryId,d);status($("formStatus"),"Updated.",true)}else{let r=push(ref(db,"prayinfoEntries"));currentEntryId=r.key;await set(r,{...d,createdAt:Date.now(),createdBy:user.email});log("create",currentEntryId,d);status($("formStatus"),"Saved.",true)}updateAccess()}
$("deleteEntryBtn").onclick=async()=>{if(!isAdmin()||!currentEntryId)return;if(!confirm("Delete this entry?"))return;let old=entries[currentEntryId];await set(ref(db,`deletedEntries/${currentEntryId}`),{...old,deletedAt:Date.now(),deletedBy:user.email});await remove(ref(db,`prayinfoEntries/${currentEntryId}`));log("delete",currentEntryId,old);currentEntryId=null;$("formBox").classList.add("hidden");$("emptyForm").classList.remove("hidden");updateAccess()}
function openEntry(id){
  let e=entries[id];
  if(!e)return;

  $("emptyForm").classList.add("hidden");
  $("formBox").classList.remove("hidden");

  selectedAreaId=e.fieldAreaId||"";

    let found=Object.entries(fieldAreas).find(([fid,a])=>(a.name||"")===e.fieldArea);
    if(found) selectedAreaId=found[0];
  }
  availableMembers=Object.values(fieldAreas[selectedAreaId]?.members||{}).map(m=>m.name).filter(Boolean);
  selectedParticipants=Array.isArray(e.participants)?[...e.participants]:[];
  // Include saved participant names in available list so edit view can still show them
  selectedParticipants.forEach(n=>{if(n && !availableMembers.includes(n)) availableMembers.push(n)});

  $("pastorName").value=e.pastorName||fieldAreas[selectedAreaId]?.pastorName||"";
  $("currentDate").value=e.currentDate||"";
  $("specialNote").value=e.specialNote||"";
  $("offering").value=e.offering||"";
  renderParticipants();
  renderRows();
  updateAccess();
  renderEntryList();
  setTimeout(fitMobilePaper,50)
}
function renderEntryList(){let q=($("entrySearch").value||"").toLowerCase();let arr=Object.entries(entries).map(([id,d])=>({id,...d})).filter(e=>(`${e.fieldArea||""} ${e.pastorName||""}`).toLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));let list=$("entryList");if(!arr.length){appendMetaEmpty(list,"No entries.");return}clearNode(list);arr.forEach(e=>{let div=document.createElement("div");div.className="card-list"+(e.id===currentEntryId?" active":"");let row=document.createElement("div");row.style.display="flex";row.style.justifyContent="space-between";row.style.gap="8px";let textWrap=document.createElement("div");appendTextNode(textWrap,"div","card-title",e.fieldArea||"No area");appendTextNode(textWrap,"div","card-meta",`${e.currentDate||""} • ${e.pastorName||""} • ${(e.participants||[]).length}នាក់`);let btn=appendTextNode(row,"button","btn small","Open");row.insertBefore(textWrap,btn);div.appendChild(row);div.onclick=()=>openEntry(e.id);list.appendChild(div)})}

  async function clearActivityLogs(){
    if(!(window.prayInfoIsAdmin && window.prayInfoIsAdmin())){
      alert("Admin only.");
      return;
    }

    const ok = confirm("Clear all activity logs? This will delete auditLogs from Firebase.");
    if(!ok) return;

    try{
      if(window.db && window.ref && window.remove){
        await window.remove(window.ref(window.db, "auditLogs"));
      }else{
        alert("Firebase database is not available.");
        return;
      }

      const activityList = document.getElementById("activityList");
      if(activityList){
        activityList.textContent = "";
        const empty = document.createElement("div");
        empty.className = "card-meta";
        empty.textContent = "No logs.";
        activityList.appendChild(empty);
      }

      const statLogs = document.getElementById("statLogs");
      if(statLogs) statLogs.textContent = "0";

      alert("Activity cleared successfully.");
    }catch(err){
      alert("Clear activity error: " + (err.message || err));
    }
  }

  function installClearActivityButton(){
    let btn = document.getElementById("clearActivityBtn");
    if(btn){
      btn.classList.toggle("hidden", !(window.prayInfoIsAdmin && window.prayInfoIsAdmin()));
    }
    if(btn && !btn.dataset.boundClear){
      btn.dataset.boundClear = "1";
      btn.addEventListener("click", clearActivityLogs);
    }
  }

  window.installClearActivityButton = installClearActivityButton;
  document.addEventListener("DOMContentLoaded", installClearActivityButton);
  document.addEventListener("click", function(){ setTimeout(installClearActivityButton, 50); }, true);
})();
</script>


<script>
(function(){
  const DEFAULT_PRAYER_ROW_HEIGHT = 52;

  function autoGrowPrayerTextarea(ta){
    if(!ta) return;
    ta.style.height = DEFAULT_PRAYER_ROW_HEIGHT + "px";
    const newHeight = Math.max(DEFAULT_PRAYER_ROW_HEIGHT, ta.scrollHeight);
    ta.style.height = newHeight + "px";
    const tr = ta.closest("tr");
    const td = ta.closest("td");
    if(td){td.style.height = newHeight + "px";td.style.minHeight = DEFAULT_PRAYER_ROW_HEIGHT + "px";}
    if(tr){tr.style.height = newHeight + "px";tr.style.minHeight = DEFAULT_PRAYER_ROW_HEIGHT + "px";}
  }

  function normalizePrayerRows(){
    document.querySelectorAll("#prayerRows tr").forEach(row=>{
      const ta = row.querySelector("textarea");
      if(ta){autoGrowPrayerTextarea(ta);return;}
      row.style.height = DEFAULT_PRAYER_ROW_HEIGHT + "px";
      row.style.minHeight = DEFAULT_PRAYER_ROW_HEIGHT + "px";
    });
  }

  function installParticipantCorner(){
    const select = document.getElementById("participantSelect");
    const add = document.getElementById("addParticipantBtn");
    if(!select || !add) return;
    const row = select.closest(".select-row") || select.closest(".select-with-add");
    if(row) row.classList.add("participant-controls");
  }

  function setNameColumnWidth(){
    document.querySelectorAll(".inner-table colgroup col:nth-child(2)").forEach(col=>col.setAttribute("style","width:220px"));
    document.querySelectorAll(".prayer-header .name-col, #prayerRows .name-col").forEach(el=>el.style.width="220px");
  }

  function alignPrayerRows(){
    setNameColumnWidth();
    document.querySelectorAll("#prayerRows tr").forEach(row=>{
      const num = row.querySelector(".number-col");
      const nameCell = row.querySelector(".name-col");
      const nameDisplay = row.querySelector(".name-display");
      if(num){num.style.textAlign="center";num.style.verticalAlign="middle";}
      if(nameCell){nameCell.style.width="220px";nameCell.style.verticalAlign="middle";}
      if(nameDisplay){nameDisplay.style.display="flex";nameDisplay.style.alignItems="center";nameDisplay.style.minHeight=DEFAULT_PRAYER_ROW_HEIGHT + "px";}
    });
  }

  function removePrintArtifacts(){
    document.querySelectorAll(".print-textarea-value").forEach(el=>el.remove());
    document.querySelectorAll("textarea.print-hidden-textarea").forEach(ta=>ta.classList.remove("print-hidden-textarea"));
    document.querySelectorAll("#prayerRows .print-gap-row,#prayerRows .print-separator-row").forEach(row=>row.remove());
    document.querySelectorAll("#prayerRows tr.print-hide-empty").forEach(row=>row.classList.remove("print-hide-empty"));
  }

  function preparePrintTextareaValues(){
    document.querySelectorAll("#prayerRows textarea").forEach(ta=>{
      const div = document.createElement("div");
      div.className = "print-textarea-value";
      div.textContent = ta.value || "";
      ta.classList.add("print-hidden-textarea");
      ta.after(div);
      const tr = ta.closest("tr");
      if(tr) tr.style.height = "auto";
    });
  }

  function rowHasData(row){
    const name = row.querySelector(".name-display")?.textContent?.trim() || "";
    const number = row.querySelector(".number-col")?.textContent?.trim() || "";
    const textarea = row.querySelector("textarea")?.value?.trim() || "";
    const printText = row.querySelector(".print-textarea-value")?.textContent?.trim() || "";
    return !!(name || number || textarea || printText);
  }

  function markEmptyRowsForPrint(){
    document.querySelectorAll("#prayerRows tr").forEach(row=>{
      row.classList.toggle("print-hide-empty", !rowHasData(row));
    });
  }

  function addPrintGapRow(){
    const tbody = document.getElementById("prayerRows");
    if(!tbody) return;
    const rows = Array.from(tbody.querySelectorAll("tr")).filter(row=>!row.classList.contains("print-gap-row") && !row.classList.contains("print-separator-row"));
    let lastDataRow = null;
    rows.forEach(row=>{if(rowHasData(row)) lastDataRow=row;});
    if(!lastDataRow) lastDataRow = rows[0] || null;
    if(!lastDataRow) return;
    const gap = document.createElement("tr");
    gap.className = "print-gap-row";
    const td = document.createElement("td");
    td.colSpan = 3;
    td.innerHTML = "&nbsp;";
    gap.appendChild(td);
    lastDataRow.insertAdjacentElement("afterend", gap);
  }

  function getFieldAreaText(){
    const fieldValue = document.getElementById("fieldValue") || document.getElementById("fieldAreaValue");
    return fieldValue?.textContent?.trim() || "";
  }

  function ensurePrintFieldAreaText(){
    const fieldValue = document.getElementById("fieldValue") || document.getElementById("fieldAreaValue");
    if(!fieldValue) return;
    let printText = document.getElementById("printFieldAreaText");
    if(!printText){
      printText = document.createElement("span");
      printText.id = "printFieldAreaText";
      printText.className = "print-field-area-text";
      fieldValue.after(printText);
    }
    printText.textContent = getFieldAreaText();
  }

  function cleanPdfNamePart(value){return (value||"").replace(/[⌄▾▼:]/g,"").replace(/\s+/g,"").trim()}
  function normalizeDateForFileName(rawDate){
    rawDate = (rawDate || "").trim();
    if(!rawDate) return new Date().toISOString().slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) return rawDate;
    if(rawDate.includes("/")){
      const parts = rawDate.split("/").map(p=>p.padStart(2,"0"));
      if(parts.length===3 && parts[2].length===4) return `${parts[2]}-${parts[0]}-${parts[1]}`;
    }
    return rawDate.replace(/[^\d-]/g,"");
  }
  function setPrayInfoPdfFileName(){
    const area = cleanPdfNamePart(getFieldAreaText() || "Unknown");
    const date = normalizeDateForFileName(document.getElementById("currentDate")?.value || "");
    document.title = `ពួកជំនុំតាមផ្ទះ-វាលស្មៅ${area}-${date}.pdf`;
  }

  function finalTableFix(){installParticipantCorner();alignPrayerRows();normalizePrayerRows();ensurePrintFieldAreaText();}
  function finalPrintPrepare(){removePrintArtifacts();finalTableFix();preparePrintTextareaValues();markEmptyRowsForPrint();addPrintGapRow();setPrayInfoPdfFileName();}

  document.addEventListener("input", e=>{if(e.target?.matches?.("#prayerRows textarea")) autoGrowPrayerTextarea(e.target)}, true);
  document.addEventListener("click", ()=>setTimeout(finalTableFix,80), true);
  document.addEventListener("change", ()=>setTimeout(finalTableFix,80), true);
  document.addEventListener("DOMContentLoaded", finalTableFix);
  window.addEventListener("resize", finalTableFix);
  window.addEventListener("beforeprint", finalPrintPrepare);
  window.addEventListener("afterprint", removePrintArtifacts);

  window.normalizePrayerRows = normalizePrayerRows;
  window.finalPrintPrepare = finalPrintPrepare;
  window.setPrayInfoPdfFileName = setPrayInfoPdfFileName;
})();
</script>

</body>
