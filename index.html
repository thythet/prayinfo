<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrayInfo Private</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--bg1:#0a1220;--bg2:#101b31;--glass:rgba(255,255,255,.08);--stroke:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#b9c2d2;--blue:#5da7ff;--blue2:#7a79ff;--success:#78d69a;--paper:#ffffff;--ink:#111111;--line:#1c1c1c;--shadow:0 18px 46px rgba(0,0,0,.28)}
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:"Battambang","DM Sans",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(93,167,255,.16),transparent 30%),radial-gradient(circle at bottom right,rgba(113,82,255,.12),transparent 28%),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
    button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .glass{background:rgba(255,255,255,.08);border:1px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{width:min(460px,100%);border-radius:28px;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-weight:700;font-size:24px}
    .brand-icon{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(93,167,255,.35),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.12);color:#fff;font-size:24px}
    .sub{color:var(--muted);line-height:1.7;margin:0 0 18px;font-size:14px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.field label{font-size:13px;color:#dbe5f2;font-weight:600}
    .input{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.06);color:#fff;padding:14px 16px;outline:none}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;border-radius:16px;padding:13px 18px;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.2s ease}
    .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.13)} .btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:rgba(255,255,255,.18)} .btn.danger{background:rgba(255,125,125,.12);border-color:rgba(255,125,125,.25);color:#ffd3d3}
    .status{margin-top:14px;color:var(--muted);min-height:20px;font-size:13px}.app-shell{max-width:1500px;margin:0 auto;padding:20px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:16px 18px;border-radius:24px}.topbar h1{margin:0;font-size:28px;line-height:1.3}.topbar p{margin:4px 0 0;color:var(--muted);font-size:14px}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);font-size:12px;color:#dbe9ff;font-weight:600}
    .layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;min-height:calc(100vh - 130px)} .panel{border-radius:26px;overflow:hidden}.panel-header{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
    .panel-title{font-size:20px;font-weight:700;margin:0}.panel-sub{font-size:13px;color:var(--muted);margin-top:4px}.panel-body{padding:16px}.search{margin-bottom:14px;position:relative}.search .input{padding-left:42px}.search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#bfdcff;font-size:18px}
    .entry-list{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 260px);overflow:auto;padding-right:4px}.entry-card{padding:14px 15px;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.2s ease}
    .entry-card:hover,.entry-card.active{background:rgba(93,167,255,.16);border-color:rgba(143,197,255,.28)}.entry-name{font-size:17px;font-weight:700;line-height:1.45}.entry-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}.entry-id{font-size:12px;color:#d9ecff;margin-top:3px}
    .workspace{padding:16px}.toolbar-shell{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.viewer-note{color:var(--muted);font-size:13px}
    .page-shell{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 36px rgba(0,0,0,.18)}
    .page-toolbar{width:min(100%,900px);margin:0 auto 14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.page-toolbar button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer}
    .page{width:min(100%,900px);margin:0 auto;background:var(--paper);padding:24px 28px 32px;box-shadow:0 14px 40px rgba(0,0,0,.08);color:var(--ink);font-family:"Battambang",sans-serif}.title{margin:0 0 10px;text-align:center;font-size:27px;font-weight:700}
    .subhead{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:16px;margin-bottom:10px;font-size:18px}.subhead .center{text-align:center;justify-self:center}.subhead .right{text-align:right;justify-self:stretch;padding-right:18px;box-sizing:border-box}.subhead .right .inline-field{width:100%;justify-content:flex-end}
    .inline-field{display:inline-flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}.line-input{min-width:130px;width:130px;border:0;border-bottom:1px solid transparent;background:transparent;font:inherit;padding:2px 0;outline:none;color:inherit}
    .field-area-picker{position:relative;display:inline-block;min-width:0}.field-area-toggle{width:auto;min-height:28px;padding:0 50px 0 0;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;line-height:1.4;text-align:left;cursor:pointer;position:relative}.field-area-toggle i{position:absolute;top:50%;right:20px;transform:translateY(-48%);font-size:20px;line-height:1;color:#111111;pointer-events:none}
    .field-area-panel{position:absolute;top:calc(100% + 8px);left:0;width:360px;min-width:100%;max-height:320px;display:none;border:1px solid #cfd6de;border-radius:12px;background:#ffffff;box-shadow:0 18px 40px rgba(16,25,37,.16);overflow:hidden;z-index:50}.field-area-picker.open .field-area-panel{display:block}
    .field-area-search{width:calc(100% - 20px);margin:10px;padding:8px 10px;border:1px solid #cfd6de;border-radius:8px;font:inherit;outline:none}.field-area-list{max-height:250px;overflow:auto;padding:0 0 8px;overflow-x:hidden}.field-area-group{padding:8px 12px 4px;font-size:14px;font-weight:700;color:#5f6772;background:#f8fafc;border-top:1px solid rgba(207,214,222,.5)}.field-area-option{display:block;width:100%;padding:7px 12px;border:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;white-space:normal;word-break:break-word}.field-area-option:hover,.field-area-option:focus{background:#eef5ff;outline:none}.field-area-empty{padding:10px 12px;color:#7b8794;font-size:14px}
    .date-field{display:inline-flex;align-items:center;gap:6px}#currentDate{min-width:170px;width:170px;text-align:left;padding-right:40px}
    table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--line)} td,th{border:1px solid var(--line);padding:0;vertical-align:middle}.label-cell{width:150px;padding:8px 10px;font-size:18px;font-weight:700;vertical-align:top}.participant-count{color:#2e5fbf;font-weight:700}.number-col{width:66px;text-align:center;font-size:18px}.name-col{width:250px}.field-cell{min-height:52px;height:auto}
    .field-cell input,.field-cell textarea{width:100%;border:0;background:transparent;font:inherit;color:inherit;outline:none;padding:10px 12px;box-sizing:border-box}.field-cell textarea{display:block;height:52px;min-height:52px;resize:none;overflow:hidden;line-height:1.25;white-space:pre-wrap}.name-display{width:100%;height:100%;display:flex;align-items:center;padding:10px 12px;font:inherit;color:inherit}
    .participant-wrap{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;flex-wrap:wrap}.participant-wrap span{font-size:18px;white-space:nowrap;padding-top:6px}.participant-controls{flex:1;min-width:0}.select-with-add{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}.select-with-add .selected-participant{flex:1;min-width:0;padding:0}.select-with-add select{width:116px;flex:0 0 116px}.participant-select-wrap{position:relative;width:116px;flex:0 0 116px}.participant-select-wrap i{position:absolute;top:50%;right:8px;transform:translateY(-48%);font-size:20px;line-height:1;color:#334155;pointer-events:none}
    #participantSelect{appearance:none;-webkit-appearance:none;-moz-appearance:none;height:34px;width:100%;padding:6px 28px 6px 10px;border:1px solid #cfd6de;border-radius:8px;background-color:#ffffff;background-image:linear-gradient(to right,#d8e0e8,#d8e0e8);background-position:calc(100% - 28px) 6px;background-size:1px 20px;background-repeat:no-repeat;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);font-size:15px} #participantSelect.is-hidden{display:none}
    .add-btn{border:1px solid #cfd6de;background:#ffffff;color:#183042;border-radius:8px;padding:6px 10px;font:inherit;font-size:15px;line-height:1;cursor:pointer;white-space:nowrap}.selected-participant{min-height:32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;color:#183042;white-space:normal;word-break:break-word}.selected-participant.empty{color:#5f6772}.participant-pill{display:inline-flex;align-items:center;min-height:32px;padding:5px 12px;border:1px solid #cfd6de;border-radius:999px;background:#f8fafc;color:#183042;line-height:1.2;white-space:nowrap}
    .single-line{height:52px}.prayer-cell{padding:0}.inner-table{width:100%;border-collapse:collapse;table-layout:fixed;border:0}.inner-table th,.inner-table td{border:1px solid var(--line);padding:0;vertical-align:middle}.prayer-header th{height:44px;font-size:18px;font-weight:700;text-align:center;background:rgba(0,0,0,.02)}.prayer-row td{height:48px}.print-page-number{display:none}
    .empty-state{min-height:420px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--muted);gap:12px}.empty-state i{font-size:56px;color:#c7dcff}
    .readonly .page input,.readonly .page textarea,.readonly .page select,.readonly .page button.add-btn{pointer-events:none}.readonly #participantSelect,.readonly #addParticipantBtn,.readonly #resetFormBtn{display:none!important}
    @page{size:A4 portrait;margin:8mm 10mm 14mm}
    @media print{html,body{counter-reset:page 1}body{padding:0;background:#fff;font-size:14px}.topbar,.left-panel,.toolbar-shell,.page-toolbar,#loginScreen{display:none!important}.layout{display:block}.workspace{padding:0}.panel,.page-shell{background:none!important;border:none!important;box-shadow:none!important;padding:0!important}.page{width:100%;max-width:none;padding:0;box-shadow:none;margin:0}.title{font-size:24px;margin-bottom:8px}.subhead{grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:16px;margin-bottom:8px}#participantSelect,#addParticipantBtn,.participant-select-wrap i,.field-area-toggle i,#fieldAreaPanel,#resetFormBtn{display:none!important}.print-page-number{display:block;position:fixed;left:0;right:0;bottom:2mm;text-align:center;font-size:11px;color:#000}.print-page-number::after{content:"ទំព័រ " counter(page, decimal-leading-zero)}}
    @media (max-width:1100px){.layout{grid-template-columns:1fr}.entry-list{max-height:320px}}
    @media screen and (max-width:760px){
      .app-shell{padding:12px}
      .workspace{padding:12px}
      .toolbar-shell{align-items:flex-start}
      .page-shell{padding:12px}
      .page-toolbar{
        width:100%;
        min-width:760px;
        margin:0 0 12px;
        justify-content:flex-end;
      }
      .page{
        width:760px;
        min-width:760px;
        padding:16px 14px 18px;
      }
      .title{font-size:22px}
      .subhead{
        grid-template-columns:1fr;
        gap:8px;
        font-size:15px;
      }
      .subhead .center,
      .subhead .right{
        text-align:left;
        justify-self:start;
        padding-right:0;
      }
      .subhead .right .inline-field{
        justify-content:flex-start;
      }
      .inline-field{
        width:100%;
        white-space:normal;
        flex-wrap:wrap;
        gap:6px;
      }
      .line-input{
        width:100%;
        min-width:0;
      }
      .field-area-panel{
        width:min(320px, calc(100vw - 48px));
      }
      .label-cell,
      .number-col,
      .participant-wrap span{
        font-size:14px;
      }
      .participant-wrap{
        gap:8px;
        padding:8px 10px;
      }
      .participant-controls{
        width:100%;
      }
      .select-with-add{
        align-items:flex-start;
        flex-wrap:wrap;
      }
      .select-with-add .selected-participant{
        width:100%;
      }
      .participant-select-wrap,
      .select-with-add select{
        width:108px;
        flex:0 0 108px;
      }
      .name-col{
        width:150px;
      }
      .field-cell textarea,
      .field-cell input,
      .name-display{
        padding:8px 10px;
      }
    }
